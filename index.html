<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/WhoPaid/favicon.ico?v=20260820" />
    <link rel="apple-touch-icon" sizes="180x180" href="/WhoPaid/apple-touch-icon.png?v=20260820" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121316" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="description" content="Fast, mobile-first PWA for group travel and multi-currency expense sharing." />
    <title>WhoPaid — Group Expense Sharing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      .boot-shell {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 32px;
        box-sizing: border-box;
        background: radial-gradient(circle at 50% 38%, rgba(79, 94, 115, 0.22), transparent 34%), #121316;
        color: #f8fafc;
        text-align: center;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .boot-shell strong { font-size: 1.35rem; letter-spacing: -0.035em; }
      .boot-shell span { color: #94a3b8; font-size: 0.82rem; font-weight: 600; }
      .boot-ring {
        position: relative;
        width: 150px;
        height: 150px;
        margin: 54px 0 18px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: conic-gradient(transparent 0 34deg, #63758f 34deg 126deg, transparent 126deg 360deg);
        animation: boot-ring-spin 1.1s linear infinite;
      }
      .boot-ring::before {
        content: "";
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: #121316;
      }
      .boot-ring::after {
        content: "•••";
        position: relative;
        z-index: 1;
        color: #94a3b8;
        font: 600 15px ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.14em;
        animation: boot-ring-counter-spin 1.1s linear infinite;
      }
      @keyframes boot-ring-spin { to { transform: rotate(360deg); } }
      @keyframes boot-ring-counter-spin { to { transform: rotate(-360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-ring,
        .boot-ring::after { animation-duration: 2.6s; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" role="status" aria-live="polite">
        <strong>WhoPaid</strong>
        <div class="boot-ring" aria-hidden="true"></div>
        <span>Opening your saved trips...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
